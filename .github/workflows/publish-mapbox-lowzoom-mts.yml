name: publish-mapbox-lowzoom-mts

on:
  workflow_dispatch:
    inputs:
      level:
        description: Geometry level to republish with explicit low-zoom coverage
        required: true
        type: choice
        options:
          - province
          - department

permissions:
  contents: write

concurrency:
  group: publish-mapbox-lowzoom-mts-${{ inputs.level }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAPBOX_USERNAME: matuteiglesias2
      MAPBOX_UPLOAD_TOKEN: ${{ secrets.MAPBOX_UPLOAD_TOKEN }}
      MTS_LEVEL: ${{ inputs.level }}

    steps:
      - name: Require a dedicated publication branch
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "Dispatch this provider-write workflow from a dedicated branch based on current main."
            exit 1
          fi
          test -n "$MAPBOX_UPLOAD_TOKEN"

      - name: Checkout atlas branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact province Geography parent
        if: inputs.level == 'province'
        uses: actions/checkout@v4
        with:
          repository: matuteiglesias/argentina-geography
          ref: ef315a4ca7e53eb98d9adf106b0cee190a6c5cd3
          path: upstream/argentina-geography

      - name: Checkout exact department Geography parent
        if: inputs.level == 'department'
        uses: actions/checkout@v4
        with:
          repository: matuteiglesias/argentina-geography
          ref: 5b8ee5f9ccaa6a7b1bd94127c37733782cc70c68
          path: upstream/argentina-geography

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: upstream/argentina-geography/pyproject.toml

      - name: Install governed materializer and proof dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e "./upstream/argentina-geography[dev]" mercantile mapbox-vector-tile requests
          python -m py_compile scripts/publish_lowzoom_mts.py

      - name: Materialize governed province geometry with byte-drift tolerance
        if: inputs.level == 'province'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path("upstream/argentina-geography/config/sources/ign_administrative_province.json")
          target = Path("/tmp/ign-province-publication-config.json")
          config = json.loads(source.read_text())
          pinned = config.pop("expected_normalized_content_sha256", None)
          target.write_text(json.dumps(config, indent=2, ensure_ascii=False) + "\n")
          print(
              "Publication overlay keeps source SHA/size, IDs, schema, CRS and geometry gates strict; "
              f"normalized Parquet byte pin relaxed from {pinned}."
          )
          PY
          python -m argentina_geography.sources.ign_province materialize \
            --config /tmp/ign-province-publication-config.json \
            --output /tmp/ign-province-release

      - name: Materialize exact governed department geometry
        if: inputs.level == 'department'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/indec-2010-source
          python -m argentina_geography.sources.indec_2010_radio materialize             --source-dir /tmp/indec-2010-source             --output /tmp/indec-2010-radio
          python -m argentina_geography.sources.indec_2010_radio verify             --release /tmp/indec-2010-radio
          python -m argentina_geography.derived.indec_2010_department materialize             --parent-release /tmp/indec-2010-radio             --output /tmp/indec-2010-department
          python -m argentina_geography.derived.indec_2010_department verify             --release /tmp/indec-2010-department

      - name: Verify semantic geometry contract and report byte drift
        shell: bash
        run: |
          set -euo pipefail
          if [ "$MTS_LEVEL" = "province" ]; then
            export GEOJSON=/tmp/ign-province-release/geography.geojson
            export GEOPARQUET=/tmp/ign-province-release/geography.parquet
            export MANIFEST=mapbox/manifests/province-w3.json
          else
            export GEOJSON=/tmp/indec-2010-department/geography.geojson
            export GEOPARQUET=/tmp/indec-2010-department/geography.parquet
            export MANIFEST=mapbox/manifests/department-w3.json
          fi
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from shapely.geometry import shape

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          manifest = json.loads(Path(os.environ["MANIFEST"]).read_text())
          geojson_path = Path(os.environ["GEOJSON"])
          geoparquet_path = Path(os.environ["GEOPARQUET"])
          payload = json.loads(geojson_path.read_text())
          features = payload.get("features", [])
          expected_ids = {str(value) for value in manifest["fixture_geography_ids"]}
          observed_ids = {
              str(feature.get("properties", {}).get("geography_id"))
              for feature in features
          }

          if payload.get("type") != "FeatureCollection":
              raise SystemExit("display geometry is not a GeoJSON FeatureCollection")
          if len(features) != len(expected_ids):
              raise SystemExit(
                  f"feature-count drift: expected {len(expected_ids)}, found {len(features)}"
              )
          if observed_ids != expected_ids:
              missing = sorted(expected_ids - observed_ids)
              extra = sorted(observed_ids - expected_ids)
              raise SystemExit(
                  f"geography_id drift: missing={missing[:20]}, extra={extra[:20]}"
              )
          for feature in features:
              geography_id = str(feature.get("properties", {}).get("geography_id"))
              if feature.get("id") != geography_id:
                  raise SystemExit(f"feature id/property mismatch for {geography_id}")
              geometry = shape(feature.get("geometry"))
              if geometry.is_empty or not geometry.is_valid:
                  raise SystemExit(f"unusable display geometry for {geography_id}")

          evidence = manifest["upstream_audit"]["candidate_evidence"][0]
          expected_artifact = manifest["parent_release"]["artifact_sha256"]
          expected_display = evidence["display_geojson_sha256"]
          observed_artifact = sha256(geoparquet_path)
          observed_display = sha256(geojson_path)

          print(
              f"semantic geometry gate PASS: {len(expected_ids)} exact IDs, "
              "valid non-empty display geometry"
          )
          if observed_artifact != expected_artifact:
              print(
                  "::warning title=Normalized geography SHA drift::"
                  f"expected {expected_artifact}, observed {observed_artifact}; "
                  "accepted for this publication because source/semantic gates passed"
              )
          if observed_display != expected_display:
              print(
                  "::warning title=Display GeoJSON SHA drift::"
                  f"expected {expected_display}, observed {observed_display}; "
                  "accepted for this publication because exact IDs and geometry gates passed"
              )

          summary = Path(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"))
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("\n### Geometry publication input\n\n")
              handle.write(f"- level: \`{os.environ['MTS_LEVEL']}\`\n")
              handle.write(f"- exact IDs: **{len(expected_ids)}/{len(expected_ids)}**\n")
              handle.write(
                  f"- canonical artifact SHA match: **{observed_artifact == expected_artifact}**\n"
              )
              handle.write(
                  f"- display GeoJSON SHA match: **{observed_display == expected_display}**\n"
              )
              if observed_artifact != expected_artifact or observed_display != expected_display:
                  handle.write(
                      "- disposition: **PASS_WITH_WARNINGS** — byte drift accepted only after "
                      "strict source/identity/geometry validation.\n"
                  )
          PY

      - name: Publish MTS geometry and prove exact IDs at atlas zoom
        shell: bash
        run: |
          set -euo pipefail
          if [ "$MTS_LEVEL" = "province" ]; then
            export MTS_GEOJSON=/tmp/ign-province-release/geography.geojson
            export MTS_GEOPARQUET=/tmp/ign-province-release/geography.parquet
            export MTS_MANIFEST=mapbox/manifests/province-w3.json
            export MTS_PROOF=mapbox/manifests/province-w3-publication-proof.json
          else
            export MTS_GEOJSON=/tmp/indec-2010-department/geography.geojson
            export MTS_GEOPARQUET=/tmp/indec-2010-department/geography.parquet
            export MTS_MANIFEST=mapbox/manifests/department-w3.json
            export MTS_PROOF=mapbox/manifests/department-w3-publication-proof.json
          fi
          python scripts/publish_lowzoom_mts.py

      - name: Verify atlas after provider proof
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run verify

      - name: Commit low-zoom provider proof back to publication branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$MTS_LEVEL" = "province" ]; then
            git add mapbox/manifests/province-w3.json mapbox/manifests/province-w3-publication-proof.json
          else
            git add mapbox/manifests/department-w3.json mapbox/manifests/department-w3-publication-proof.json
          fi
          if git diff --cached --quiet; then
            echo "No provider proof changes to commit."
            exit 0
          fi
          git commit -m "fix: record low-zoom Mapbox MTS proof for $MTS_LEVEL"
          git push origin HEAD:"$GITHUB_REF_NAME"
