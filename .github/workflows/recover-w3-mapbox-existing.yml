name: recover-existing-w3-mapbox-province

on:
  push:
    branches:
      - ops/recover-w3-mapbox-existing
    paths:
      - .github/workflows/recover-w3-mapbox-existing.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recover-existing-w3-mapbox-province
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MAPBOX_USERNAME: matuteiglesias2
      MAPBOX_UPLOAD_TOKEN: ${{ secrets.MAPBOX_UPLOAD_TOKEN }}
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bounded recovery dependencies
        run: python -m pip install mercantile mapbox-vector-tile

      - name: Recover and prove existing immutable tileset
        run: python scripts/recover_w3_mapbox_existing.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install atlas dependencies
        run: npm ci

      - name: Verify recovered atlas contract
        run: npm run verify

      - name: Commit recovered provider proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapbox/manifests/province-w3.json mapbox/manifests/province-w3-publication-proof.json
          if git diff --cached --quiet; then
            echo "No provider proof changes to commit."
            exit 0
          fi
          git commit -m "feat: recover live W3 Mapbox province proof"
          git push origin HEAD:"$GITHUB_REF_NAME"
