name: publish-w3-mapbox-department

on:
  workflow_dispatch:
  push:
    branches: ["feat/department-geometry-transport"]
    paths:
      - ".github/workflows/publish-department-mapbox.yml"
      - "scripts/publish_department_mapbox.py"
      - "scripts/publish_w3_mapbox.py"
      - "scripts/finalize_w3_parent_identity.py"

permissions:
  contents: write

concurrency:
  group: publish-w3-mapbox-department
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      MAPBOX_USERNAME: matuteiglesias2
      MAPBOX_UPLOAD_TOKEN: ${{ secrets.MAPBOX_UPLOAD_TOKEN }}
      UPSTREAM_COMMIT: 5b8ee5f9ccaa6a7b1bd94127c37733782cc70c68
    steps:
      - name: Require dedicated publication branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feat/department-geometry-transport"
          test -n "$MAPBOX_UPLOAD_TOKEN"
          echo "Department publication proof will be written back to $GITHUB_REF_NAME"

      - name: Checkout atlas branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact Argentina Geography parent
        uses: actions/checkout@v4
        with:
          repository: matuteiglesias/argentina-geography
          ref: 5b8ee5f9ccaa6a7b1bd94127c37733782cc70c68
          path: upstream/argentina-geography

      - name: Verify exact upstream commit
        shell: bash
        run: |
          set -euo pipefail
          observed="$(git -C upstream/argentina-geography rev-parse HEAD)"
          test "$observed" = "$UPSTREAM_COMMIT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: upstream/argentina-geography/pyproject.toml

      - name: Install upstream materializer and bounded publisher dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./upstream/argentina-geography[dev]" boto3 mercantile mapbox-vector-tile

      - name: Materialize exact official radio parent
        shell: bash
        run: |
          mkdir -p /tmp/indec-2010-source
          python -m argentina_geography.sources.indec_2010_radio materialize \
            --source-dir /tmp/indec-2010-source \
            --output /tmp/indec-2010-radio
          python -m argentina_geography.sources.indec_2010_radio verify \
            --release /tmp/indec-2010-radio

      - name: Materialize exact 525-department release
        shell: bash
        run: |
          python -m argentina_geography.derived.indec_2010_department materialize \
            --parent-release /tmp/indec-2010-radio \
            --output /tmp/indec-2010-department
          python -m argentina_geography.derived.indec_2010_department verify \
            --release /tmp/indec-2010-department

      - name: Verify pinned release hashes before provider write
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("/tmp/indec-2010-department")
          expected = {
              "geography.parquet": "7b6664f59d0f4f82937d52ca8fe01a22b1f4dc40d83bc49c608dfd1b40b390c5",
              "geography.geojson": "399033eb5bd79337959f2d3483f6843c71551726723308a6bcc4c7889fe27df8",
          }
          for name, wanted in expected.items():
              observed = hashlib.sha256((root / name).read_bytes()).hexdigest()
              if observed != wanted:
                  raise SystemExit(f"{name} hash drift: expected {wanted}, found {observed}")

          manifest = json.loads((root / "manifest.json").read_text())
          identity = manifest["department_identity"]
          if identity["feature_count"] != 525:
              raise SystemExit("department feature count drift")
          if identity["id_set_sha256"] != "f2c1195789c5d556db3379dd89310b0b6cea4df84ef6efa14cc814dbfc831144":
              raise SystemExit("department ID inventory drift")
          if manifest["display_derivative"]["poverty_values_embedded"] is not False:
              raise SystemExit("geometry transport must remain poverty-free")
          print("Canonical department GeoParquet, display GeoJSON and exact 525-ID set verified.")
          PY

      - name: Publish geometry-only derivative and prove 525/525 vector IDs
        shell: bash
        run: python scripts/publish_department_mapbox.py

      - name: Pin exact upstream GeographySpec identity from emitted catalog
        shell: bash
        env:
          W3_UPSTREAM_CATALOG: /tmp/indec-2010-department/geography_catalog.parquet
          W3_MANIFEST: mapbox/manifests/department-w3.json
          W3_PROOF: mapbox/manifests/department-w3-publication-proof.json
          W3_EXPECTED_DATASET_ID: arggeo.indec.census.2010.department-footprint
          W3_EXPECTED_RELEASE_VERSION: derived-2010-national-c9184f47fd46
        run: python scripts/finalize_w3_parent_identity.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install atlas dependencies
        run: npm ci

      - name: Verify atlas contract after provider proof
        run: npm run verify

      - name: Commit provider proof back to publication branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapbox/manifests/department-w3.json mapbox/manifests/department-w3-publication-proof.json
          if git diff --cached --quiet; then
            echo "No publication manifest changes to commit."
            exit 0
          fi
          git commit -m "feat: record live W3 Mapbox department proof"
          git push origin HEAD:"$GITHUB_REF_NAME"
