name: Bootstrap W1 lockfile

on:
  push:
    branches:
      - feat/w1-frontend-application-seed

permissions:
  contents: write

jobs:
  lock-and-diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Resolve dependency lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Install locked dependencies
        run: npm ci
      - name: Capture typecheck diagnostics
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          status=$?
          cat typecheck.log
          echo "typecheck_exit=$status" >> typecheck.log
          exit 0
      - name: Commit diagnostic lock snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json typecheck.log
          git commit -m "chore: capture W1 dependency and typecheck snapshot"
          git push
