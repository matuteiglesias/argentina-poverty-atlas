name: Bootstrap W3 Mapbox dependency lock

on:
  push:
    branches:
      - feat/w3-province-mapbox-transport

permissions:
  contents: write

jobs:
  lock-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve Mapbox dependency lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Capture TypeScript diagnostic
        run: |
          set +e
          npm run typecheck > typecheck-w3.log 2>&1
          status=$?
          cat typecheck-w3.log
          echo "typecheck_exit=$status" >> typecheck-w3.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json typecheck-w3.log
          git commit -m "chore: capture W3 lock and typecheck diagnostic"
          git push
          exit $status
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
