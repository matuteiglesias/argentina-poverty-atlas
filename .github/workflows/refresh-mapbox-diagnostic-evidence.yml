name: refresh-mapbox-diagnostic-evidence

on:
  push:
    branches:
      - agent/mapbox-runtime-reset-diagnostics
    paths:
      - scripts/refresh_mapbox_tile_evidence.py
      - .github/workflows/refresh-mapbox-diagnostic-evidence.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mapbox-diagnostic-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove-existing-tiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAPBOX_UPLOAD_TOKEN: ${{ secrets.MAPBOX_UPLOAD_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install proof-only dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install requests mapbox-vector-tile

      - name: Re-prove exact existing low-zoom tiles
        run: |
          set -euo pipefail
          test -n "$MAPBOX_UPLOAD_TOKEN"
          python scripts/refresh_mapbox_tile_evidence.py

      - name: Commit diagnostic evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             mapbox/manifests/province-w3-publication-proof.json             mapbox/manifests/department-w3-publication-proof.json             src/map/mapboxDiagnosticFixtures.generated.json
          if git diff --cached --quiet; then
            echo "Diagnostic evidence already current."
            exit 0
          fi
          git commit -m "test: record exact browser diagnostic tile evidence"
          git push origin HEAD:"$GITHUB_REF_NAME"
