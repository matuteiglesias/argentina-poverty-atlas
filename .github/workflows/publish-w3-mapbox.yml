name: publish-w3-mapbox-province

on:
  push:
    branches: ["feat/w3-complete-mapbox"]
    paths:
      - ".github/workflows/publish-w3-mapbox.yml"

permissions:
  contents: write

concurrency:
  group: publish-w3-mapbox-province
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAPBOX_USERNAME: matuteiglesias2
      MAPBOX_UPLOAD_TOKEN: ${{ secrets.MAPBOX_UPLOAD_TOKEN }}
      UPSTREAM_COMMIT: ef315a4ca7e53eb98d9adf106b0cee190a6c5cd3
    steps:
      - name: Checkout atlas branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact Argentina Geography parent
        uses: actions/checkout@v4
        with:
          repository: matuteiglesias/argentina-geography
          ref: ef315a4ca7e53eb98d9adf106b0cee190a6c5cd3
          path: upstream/argentina-geography

      - name: Verify exact upstream commit
        shell: bash
        run: |
          set -euo pipefail
          observed="$(git -C upstream/argentina-geography rev-parse HEAD)"
          test "$observed" = "$UPSTREAM_COMMIT"
          echo "Pinned Argentina Geography commit verified: $observed"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: upstream/argentina-geography/pyproject.toml

      - name: Install upstream materializer and bounded publisher dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./upstream/argentina-geography[dev]" boto3 mercantile mapbox-vector-tile

      - name: Materialize exact governed IGN province release
        shell: bash
        run: |
          python -m argentina_geography.sources.ign_province materialize \
            --output /tmp/ign-province-release

      - name: Verify upstream release hashes before provider write
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('/tmp/ign-province-release')
          expected = {
              'geography.parquet': '3907e1e0e256f2ea768a66e14874266a576787fe724dad0d35eb9308ddc6dd7b',
              'geography.geojson': 'c49be97fef429c9bc473681e6677135bf19307da1141b1d7f6f12c50df366ed3',
          }
          for name, wanted in expected.items():
              observed = hashlib.sha256((root / name).read_bytes()).hexdigest()
              if observed != wanted:
                  raise SystemExit(f'{name} hash drift: expected {wanted}, found {observed}')

          metadata = json.loads((root / 'source_metadata.json').read_text())
          wanted_source = 'b9fcf6f90f28f1bdfcc713a47ad4ed63e2db0b000c4642611597d4ea8b897c55'
          if metadata['retrieved_file_sha256'] != wanted_source:
              raise SystemExit('IGN source snapshot hash drift')
          print('Canonical GeoParquet, display GeoJSON, and raw IGN source hashes verified.')
          PY

      - name: Publish geometry-only derivative and prove 24/24 vector IDs
        shell: bash
        run: python scripts/publish_w3_mapbox.py

      - name: Pin exact upstream GeographySpec identity from emitted catalog
        shell: bash
        run: python scripts/finalize_w3_parent_identity.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install atlas dependencies
        run: npm ci

      - name: Verify published atlas contract
        run: npm run verify

      - name: Commit provider proof back to bounded branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapbox/manifests/province-w3.json mapbox/manifests/province-w3-publication-proof.json
          if git diff --cached --quiet; then
            echo "No publication manifest changes to commit."
            exit 0
          fi
          git commit -m "feat: record live W3 Mapbox province proof"
          git push origin HEAD:feat/w3-complete-mapbox
