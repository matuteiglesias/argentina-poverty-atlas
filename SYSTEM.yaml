schema_version: 1
id: public.argentina-poverty-atlas
repository:
  id: repo.argentina-poverty-atlas
  github: matuteiglesias/argentina-poverty-atlas
domain: public-research
system: argentina-poverty
role: public-atlas-consumer
lifecycle: active-product-development
authority:
  status: current
  owns:
    - public poverty-atlas information architecture
    - interactive map and choropleth presentation semantics
    - period/universe/measure navigation and shareable URL state
    - Mapbox geometry transport/presentation integration
    - compatibility proof between exact poverty facts and exact geography releases
    - public lineage, methodology, quality and citation UX
    - deterministic synthetic frontend fixtures
  does_not_own:
    - poverty methodology or FGT computation
    - scientific aggregation of released facts into new poverty estimands
    - Census sampling or population-frame estimation
    - welfare/income model training, promotion or inference
    - poverty-line production
    - geography identity, geometry authority or spatial repair
    - official statistical publication
interfaces:
  consumes:
    - artifact:poverty-estimate-release@2
    - artifact:argentina-geography-geography-release
  poverty_consumer_profile:
    schema: atlas-poverty-consumer-profile/v1
    path: contracts/poverty-release-consumer-v1.json
    capability_source: capabilities.json
    geography_join: exact_governed_id
    browser_scientific_aggregation: false
  produces:
    - artifact:argentina-poverty-atlas-release@1
    - application:argentina-poverty-atlas-web
upstream:
  - repo.indice-pobreza-uba
  - repo.argentina-geography
downstream:
  - public-web-users
  - research-and-policy-users
technology_direction:
  frontend: Vite + React + TypeScript
  ui: Tailwind + shadcn/ui components
  charts: Recharts or equivalent small React chart layer
  map: Mapbox GL JS 3.x
  hosting: static deployment, Vercel-compatible
  server_required: false
security:
  public_map_token: restricted browser token only
  secret_mapbox_credentials: CI/secret-store only
  committed_secrets_allowed: false
verification:
  status: fixture-product-proven-live-transport-pending
  completed_proofs:
    - W2 deterministic 24-jurisdiction synthetic poverty release and consumer projection
    - exact IGN 24-province parent pinned from argentina-geography at ef315a4ca7e53eb98d9adf106b0cee190a6c5cd3
    - W4 exact-ID runtime data join with one Mapbox Standard map and feature-state choropleth architecture
    - W4 interaction and responsive map UX
    - W5 editorial homepage, explorer and province-detail product surface
    - build, typecheck, tests and secret-scan gates on merged product waves
  remaining_proofs:
    - governed Mapbox provider write and exact tileset/source-layer identity
    - 24/24 geography_id proof from published vector tiles
    - restricted public browser token and live browser proof
    - consume first consequential real poverty-estimate-release@2 without producer-code import
maintenance:
  cadence: active-development
